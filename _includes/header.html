<header class="header-outer">
  <h1 class="site-title">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% if site.logo %}<img class="site-logo" src="{{ site.logo | relative_url }}" alt="" width="70" height="70">{% endif %}
  </h1>
  <p class="site-description">{{ site.description }}</p>
</header>
